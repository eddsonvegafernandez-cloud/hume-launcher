name: Build Plume APK

on:
  push:
    branches: [plume]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: plume-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar APK en Releases (enlace fijo para Downloader)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" plume.apk
          gh release delete plume-latest --cleanup-tag -y || true
          gh release create plume-latest plume.apk --target "$GITHUB_SHA" --prerelease \
            --title "Plume (ultima version)" --notes "APK compilado automaticamente desde la rama plume."
